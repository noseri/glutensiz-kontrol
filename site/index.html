<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glutensiz Kontrol</title>
<meta name="description" content="İstanbul ve Ankara çölyak derneklerinin glutensiz onay listeleri, tek aramada.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glutensiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Manrope;font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/*
VOICE: sakin, kesin, eczane etiketi kadar net; süs yok, karar hızlı.
IDEA: market rafındaki fiyat etiketi — her ürünün yanında tek bakışta okunan küçük bir onay etiketi.
PICTURE: aramanın kendisi; sonuç kartlarındaki yeşil/sarı/kırmızı karar şeridi.
COLOUR and TYPE: beyaz zemin, mürekkep siyahı; renk yalnızca karar için (yeşil, kehribar, kırmızı). Manrope.
LAYOUT: tek sütun, üstte yapışkan arama; telefonda başparmakla kullanılacak geniş hedefler.
*/
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0f1113);--ink:light-dark(#121417,#eef0f2);--mut:light-dark(#5d6670,#9aa3ad);
  --line:light-dark(#e8eaed,#262a2f);--soft:light-dark(#f6f7f8,#171a1d);--card:light-dark(#ffffff,#14171a);
  --ok:light-dark(#0b7a42,#4fd18f);--okbg:light-dark(#e9f6ef,#11281d);
  --one:light-dark(#9a5800,#f1b75a);--onebg:light-dark(#fdf4e4,#2a2112);
  --part:light-dark(#8a6a00,#e3c766);--partbg:light-dark(#fbf7e6,#26230f);
  --no:light-dark(#b42318,#ff8a80);--nobg:light-dark(#fdeceb,#2c1513);
  --rd:light-dark(#475467,#b8c0cc);--rdbg:light-dark(#f2f4f7,#1c2026);
  --focus:light-dark(#121417,#eef0f2)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{--pad:clamp(16px,4vw,32px);max-width:calc(760px + 2 * var(--pad));margin:0 auto;padding:0 var(--pad)}
header.top{padding:22px 0 6px}
.brandline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(26px,5.4vw,34px);line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:800;text-wrap:balance}
.sub{color:var(--mut);font-size:14px;margin:6px 0 0}
.upd{font-size:13px;color:var(--mut);white-space:nowrap}.upd.off{color:var(--one);font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 10px;border-bottom:1px solid transparent}
.bar.stuck{border-bottom-color:var(--line)}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut);pointer-events:none}
#q{width:100%;height:56px;border:1.5px solid var(--ink);border-radius:16px;padding:0 52px 0 48px;font:600 17px/1 Manrope,system-ui,sans-serif;background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--mut);font-weight:500}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
body.searching .sub{display:none}body.searching header.top{padding-bottom:0}
.xc{font-size:12px;color:var(--mut);margin:2px 0 0}
#q:focus-visible{box-shadow:0 0 0 3px light-dark(#12141722,#eef0f233)}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;border-radius:12px;display:none;cursor:pointer;color:var(--mut)}
#clear.on{display:grid;place-items:center}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;color:var(--mut)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:8px 0 60px}
.sec{margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec b{color:var(--ink)}
/* karar kartı */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.verdict{display:flex;gap:14px;align-items:flex-start;padding:16px 16px 14px}
.dot{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.dot svg{width:22px;height:22px}
.v-ok .dot{background:var(--okbg);color:var(--ok)}.v-one .dot{background:var(--onebg);color:var(--one)}
.v-part .dot{background:var(--partbg);color:var(--part)}.v-no .dot{background:var(--nobg);color:var(--no)}
.v-rd .dot{background:var(--rdbg);color:var(--rd)}
.vt{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:0}
.vs{margin:3px 0 0;font-size:14px;color:var(--mut)}
.vs strong{color:var(--ink);font-weight:700}
.v-ok .vs .k{color:var(--ok)}.v-one .vs .k{color:var(--one)}.v-no .vs .k{color:var(--no)}
.cats{border-top:1px solid var(--line)}
.crow{padding:12px 16px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cname{font-weight:700;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip svg{width:14px;height:14px}
.c-ok{background:var(--okbg);color:var(--ok)}.c-one{background:var(--onebg);color:var(--one)}
.c-part{background:var(--partbg);color:var(--part)}.c-no{background:var(--nobg);color:var(--no)}.c-rd{background:var(--rdbg);color:var(--rd)}
ul.ls{list-style:none;margin:0;padding:0}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:7px 0}
.src{font-size:11px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-top:2px;color:var(--mut);background:var(--soft)}
.tx{font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.tx mark{background:none;color:inherit;font-weight:800}
.tx .neg{color:var(--no);font-weight:700}
.sart{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--onebg);color:var(--one);font-size:11.5px;font-weight:700;letter-spacing:.01em;vertical-align:2px}
.tx .cond{text-decoration:underline;text-decoration-color:var(--one);text-decoration-thickness:2px;text-underline-offset:3px}
.mk{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;margin-top:1px}
.mk svg{width:16px;height:16px}
.m-ok{background:var(--okbg);color:var(--ok)}.m-one{background:var(--onebg);color:var(--one)}.m-part{background:var(--partbg);color:var(--part)}
.m-no{background:var(--nobg);color:var(--no)}.m-rd{background:var(--rdbg);color:var(--rd)}
.hd{font-size:12px;color:var(--mut);margin-top:1px}
.note{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--soft);font-size:13.5px;color:var(--ink)}
.note .src{margin-right:6px}
.note.af{background:var(--okbg)}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;text-align:left;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
/* kategori listesi */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.cat{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:44px}
.cat:hover{border-color:var(--mut)}
.cat .n{font-weight:700;font-size:15px}
.meter{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--soft)}
.meter i{display:block;height:100%}
.meter .a{background:var(--ok)}.meter .b{background:var(--one);opacity:.75}.meter .c{background:var(--one);opacity:.4}
.cat .s{font-size:12.5px;color:var(--mut)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;text-align:left;cursor:pointer;min-height:48px}
.brow:first-child{border-top:0}
.brow .bn{font-weight:700}
.brow .pv{font-size:13px;color:var(--mut);display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .lft{min-width:0;flex:1}
.bdet{padding:2px 16px 12px;border-top:1px dashed var(--line)}
.legend{display:grid;gap:8px;margin:14px 0 4px}
.lg{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.lg .dot{width:34px;height:34px;border-radius:10px}
.lg b{display:block;font-size:15px}
.lg span{font-size:13.5px;color:var(--mut)}
.empty{padding:18px 16px;color:var(--mut);font-size:15px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.sg{border:1px solid var(--line);background:var(--card);border-radius:999px;height:36px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;font-size:14px;padding:8px 0;cursor:pointer;min-height:44px;color:var(--mut)}
.back svg{width:18px;height:18px}
h2{font-size:24px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.01em}
.small{font-size:13px;color:var(--mut)}
details.fold{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0}
details.fold summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;min-height:44px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";float:right;color:var(--mut);font-weight:800}
details.fold[open] summary::after{content:"–"}
.fbody{padding:0 16px 14px;font-size:14.5px}
.fbody p{margin:.5em 0}
.src-l{display:grid;gap:8px}
.src-l a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;font-size:14px}
.src-l a span:last-child{color:var(--mut);white-space:nowrap}
.venue{padding:10px 0;border-top:1px solid var(--line)}
.venue:first-child{border-top:0}
.venue b{display:block;font-size:14.5px}
.venue span{font-size:13.5px;color:var(--mut)}
.chg{font-size:14px}
.wk{padding:14px 16px}.wk-h{margin:0 0 6px;font-size:14.5px}.wk .chg{margin:0;padding-left:0;list-style:none}.wk .chg li{margin:5px 0;line-height:1.45}.wk .cn{color:var(--mut);font-size:12.5px}.wk .more{margin:8px 0 0;font-size:12.5px;color:var(--mut)}
.chg li{margin:3px 0}
.loading{padding:40px 0;color:var(--mut);text-align:center}
.moved{margin:2px 0 12px}
.sig{margin:8px 0 calc(28px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--mut);letter-spacing:.01em}
.rep{display:flex;align-items:center;gap:10px;margin:0 16px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:13.5px;line-height:1.4;text-decoration:none}
.rep:hover{border-color:var(--mut)}.rep svg{width:17px;height:17px;flex:none;color:var(--mut)}.rep span{flex:1}.rep .rs{color:var(--mut)}
.foot{margin-top:28px;font-size:12.5px;color:var(--mut);line-height:1.55}
.kbd{font-weight:700;color:var(--ink)}
/* bizim listemiz: kendi eklediğimiz ürünler (mavi; dernek renklerine karışmaz) */
:root{--us:light-dark(#1f4fd1,#8db4ff);--usbg:light-dark(#edf2fe,#16223b)}
.v-us .dot{background:var(--usbg);color:var(--us)}.v-us .vs .k{color:var(--us)}
.c-us{background:var(--usbg);color:var(--us)}.m-us{background:var(--usbg);color:var(--us)}
.us-it{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.us-it:first-child{border-top:0}
.us-t{font-size:15px;line-height:1.4;overflow-wrap:anywhere}.us-t b{font-weight:800}
.us-m{font-size:12.5px;color:var(--mut);margin-top:1px}
.us-d{font-size:13.5px;margin-top:4px}.us-d span{color:var(--mut)}
.us-n{font-size:13.5px;margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--soft);overflow-wrap:anywhere}
.us-s{display:flex;justify-content:space-between;align-items:center;gap:2px 12px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--mut)}
.us-s b{color:var(--us);font-weight:700}
.us-it.gone .us-t{text-decoration:line-through;text-decoration-color:var(--mut);color:var(--mut)}
.us-it.gone .mk{opacity:.5}
.us-it.new{animation:usnew 1.6s ease-out}
@keyframes usnew{from{background:var(--usbg)}to{background:transparent}}
.lnk{border:0;background:none;padding:4px 0;min-height:32px;font:inherit;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnk:hover{color:var(--ink)}
.lnk.us{color:var(--us);text-decoration:none;font-size:14px}
.cf{display:inline-flex;align-items:center;gap:12px;font-weight:700;color:var(--ink)}
.cf .lnk.yes{color:var(--no)}
.addb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:13px 16px;font-weight:800;font-size:15px;color:var(--us);cursor:pointer;min-height:48px;text-align:center}
.addb svg{width:18px;height:18px;flex:none}
.us-f{padding:10px 16px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.us-f b{color:var(--ink)}
.us-e{padding:14px 16px;font-size:14px;color:var(--mut)}
.us-off{padding:10px 16px 0;font-size:12.5px;color:var(--one);font-weight:600}
.addline{margin:18px 0 0;text-align:center}
details.ush{border-top:1px solid var(--line)}
details.ush summary{cursor:pointer;list-style:none;padding:11px 16px;font-size:12.5px;font-weight:700;color:var(--mut);min-height:44px}
details.ush summary::-webkit-details-marker{display:none}
details.ush[open] summary{border-bottom:1px solid var(--line)}
dialog.sheet{width:min(560px,100%);max-width:100%;max-height:92vh;max-height:92dvh;margin:auto auto 0;border:0;border-radius:22px 22px 0 0;padding:0;background:var(--card);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.18);overscroll-behavior:contain}
@media(min-width:640px){dialog.sheet{margin:auto;border-radius:22px}}
dialog.sheet::backdrop{background:rgba(12,14,16,.45)}
.sheet form{display:grid;gap:14px;padding:20px 20px calc(18px + env(safe-area-inset-bottom));max-height:inherit;overflow:auto}
.sheet h3{margin:0;font-size:21px;letter-spacing:-.01em}
.sheet .lead{margin:-8px 0 0;font-size:13.5px;color:var(--mut)}
.fl{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--mut)}
.fl .opt,.fl .small{font-weight:500}
.fl input,.fl textarea{width:100%;font:600 16px/1.35 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;-webkit-appearance:none;appearance:none}
.fl textarea{resize:vertical;min-height:64px}
.fl input:focus,.fl textarea:focus{outline:none;border-color:var(--ink)}
.fl[hidden]{display:none}
.fl input::-webkit-calendar-picker-indicator{display:none!important}
fieldset.seg,fieldset.rad{border:0;margin:0;padding:0;min-width:0}
fieldset.seg legend,fieldset.rad legend{padding:0;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--mut)}
.seg .opts{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--mut);cursor:pointer}
.seg input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg input:focus-visible+span{outline:2px solid var(--us);outline-offset:2px}
.rad .opts{display:grid;gap:6px}
.rad label{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer}
.rad input{width:18px;height:18px;margin:0;accent-color:var(--us);flex:none}
.rad label:has(input:checked){border-color:var(--us);background:var(--usbg)}
.err{margin:0;color:var(--no);font-size:14px;font-weight:700}
.err:empty{display:none}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.btn[disabled]{opacity:.55;cursor:default}
.btn2{height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:none;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
html.modal{overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media(max-width:600px){.vt{font-size:18px}.tx{font-size:15px}h2{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandline">
      <h1>Glutensiz Kontrol</h1>
      <span class="upd" id="upd"></span>
    </div>
    <p class="sub">İstanbul ve Ankara çölyak derneklerinin onay listeleri, tek aramada.</p>
  </header>
</div>
<div class="bar" id="bar">
  <div class="wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Marka veya ürün ara: Pınar, makarna, Parol…" aria-label="Marka veya ürün ara">
      <button id="clear" aria-label="Aramayı temizle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

<script>
{

const ICON = {

  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  lab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5l-5.2 8.7A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.8L14 9.5V3"/><path d="M7.4 15h9.2"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>'

ICON.us = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg>';

try { const s = localStorage.getItem('gk-dom'); if (s) st.dom = s; } catch (e) {}

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){
  s = String(s || '').normalize('NFC').replace(/[​‍﻿]/g, '').replace(/ /g, ' ');
  s = s.replace(/I/g, 'ı').replace(/İ/g, 'i').toLowerCase();
  s = s.replace(/[’'`´‘ʼ](nın|nin|nun|nün|ın|in|un|ün|ı|i|u|ü|a|e|da|de|ta|te|dan|den|tan|ten|yla|yle|la|le)(?![a-zçğıöşü])/g, '');
  s = s.replace(/[’'`´‘ʼ]/g, '');
  s = s.replace(/[çğıöşüâîû]/g, c => ({'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u'}[c]));
  s = s.normalize('NFKD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/&/g, ' & ').replace(/[^a-z0-9%&+]+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\b(?:[a-z0-9] ){2,}[a-z0-9]\b/g, m => m.replace(/ /g, ''));
  return s;
}
function fmtMonth(ym){ const [y, m] = String(ym).split('-').map(Number); return m ? MONTHS[m-1] + ' ' + y : String(y); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d] = iso.slice(0,10).split('-').map(Number); return d + ' ' + MONTHS[m-1] + ' ' + y; }
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const m = a.length, n = b.length; let prev = Array.from({length:n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++){ cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); } prev = cur; }
  return prev[n];
}

// ---- satır işaretleri
const NEG = /(gluten\s+i̇?[çc]er(ir|iyor|mektedir|ebilir|di[gğ]i)|glutenli|alma(y[ıi]n[ıi]z|mal[ıi]y[ıi]z)|kullanma(y[ıi]n[ıi]z|mal[ıi]y[ıi]z)|kullan[ıi]lmamal[ıi]d[ıi]r|kullan[ıi]lmamal[ıi]|t[üu]ketilmemeli(dir)?|t[üu]ketmeyiniz|yememeliyiz|yasak(t[ıi]r)?)/gi;
const COND = /(hari[çc]|d[ıi][şs][ıi]nda(ki)?|olmayanlar|etiket(ini|leri|i|ine)?\s+(okuy\w*|dikkat\w*)|[üu]zeri(ni)?\s+okuy\w*|okuyarak|sadece\s+[^,.;)]{1,40}|glutensiz\s+(yazan|ibareli\w*|yaz[ıi]l[ıi]|etiketi\s+olan|etiketli)|glutensiz\s+yazmal[ıi])/gi;
const CONDT = new RegExp(COND.source, 'i');
function decorate(text, toks){
  let h = esc(text);
  h = h.replace(NEG, m => '<span class="neg">' + m + '</span>');
  h = h.replace(COND, m => /class=/.test(m) ? m : '<span class="cond">' + m + '</span>');
  return h;
}
function lineMark(l){
  if (l.k === 'warn') return ['m-no', ICON.warn, 'Gluten uyarısı — almayın'];
  if (l.k === 'read') return ['m-rd', ICON.eye, 'Onay değil: etiketi okunarak alınacak'];
  if (l.k === 'info') return ['m-rd', ICON.eye, 'Bilgi'];
  if (l.st === 'both') return ['m-ok', ICON.ok2, 'Diğer listede de var'];
  if (l.st === 'part' && l.g && (PB.has(l.i) || (LBY[l.b] || []).some(o => o.c === l.c && o.s !== l.s && o.k === 'ok'))) return ['m-part', ICON.half, 'Bu liste markanın tümünü sayıyor; diğer liste yalnızca belirli ürünleri'];
  if (l.st === 'part') return ['m-part', ICON.half, 'Marka diğer listede var, bu ürün yok'];
  return ['m-one', ICON.ok, 'Yalnızca bu listede'];
}
const KO = {ok:0, info:1, read:2, warn:3}, SO = {both:0, part:1, one:2, mixed:2};
function lineOrder(a, b){
  return (KO[a.k] ?? 1) - (KO[b.k] ?? 1) || (SO[a.st] ?? 2) - (SO[b.st] ?? 2) || (a.s === b.s ? a.i - b.i : (a.s === 'ist' ? -1 : 1));
}
function lineRow(l, toks){
  const [cls, ic, tip] = lineMark(l);
  const h = D.heads[l.h];
  return '<li class="li"><span class="src" title="' + SRCN[l.s] + ' listesi">' + SRC[l.s] + '</span>' +
    '<div><div class="tx">' + decorate(l.t, toks) + '</div>' + (h ? '<div class="hd">' + SRCN[l.s] + ' · ' + esc(h) + '</div>' : '') + '</div>' +
    '<span class="mk ' + cls + '" title="' + tip + '" aria-label="' + tip + '">' + ic + '</span></li>';
}
const GST = {
  both: ['c-ok', ICON.ok2, 'İki listede de'],
  mixed: ['c-ok', ICON.half, 'Bazıları iki listede'],
  part: ['c-part', ICON.half, 'Marka iki listede, ürünler farklı'],
  ist: ['c-one', ICON.ok, 'Sadece İstanbul'],
  ank: ['c-one', ICON.ok, 'Sadece Ankara'],
  read: ['c-rd', ICON.eye, 'Etiketi okunarak'],

};
function chip(s){ const g = GST[s] || GST.ist; return '<span class="chip ' + g[0] + '">' + g[1] + g[2] + '</span>'; }
function groupStatus(b, c){
  const g = GBY[b + '|' + c];
  const ls = (LBY[b] || []).filter(l => l.c === c);
  if (ls.length && ls.every(l => l.k === 'warn')) return 'warn';
  if (ls.length && ls.every(l => l.k === 'read' || l.k === 'warn' || l.k === 'info')) return 'read';
  const s = g ? g.st : (ls.some(l => l.s === 'ist') ? (ls.some(l => l.s === 'ank') ? 'part' : 'ist') : 'ank');
  if (s === 'both' && ls.some(l => l.k === 'ok' && (l.st === 'part' || l.st === 'one'))) return 'mixed';
  return s;
}

// ---- çevrimdışı kullanım
let FROM_CACHE = false;
function showUpd(){
  if (!D) return;
  const g = fmtDate(D.checked || D.generated);
  const off = FROM_CACHE || !navigator.onLine;
  const el = $('#upd');
  el.textContent = (g ? 'Son kontrol: ' + g : '') + (off ? ' · çevrimdışı' : '');
  el.title = off ? 'İnternet yok: telefona kaydedilmiş son liste gösteriliyor.' : '';

}
addEventListener('online', () => { FROM_CACHE = false; showUpd(); });
addEventListener('offline', showUpd);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {}));
}
const STANDALONE = (typeof matchMedia === 'function' && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

// ---- bizim listemiz: kendi eklediğimiz ürünler (Cloudflare Worker + D1, bkz. worker/)
// Kimin eklediğini telefondaki ekleme şifresi, ne zaman eklendiğini sunucunun saati belirler.
const API_URL = '';  // yayından sonra sunucu adresi buraya yazılır; boşken bu bölüm hiç görünmez
const API = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).get('api')) || API_URL;
const DAY = {paket:'Paketinde glutensiz ibaresi var', uretici:'Üretici yazılı teyit verdi', analiz:'Analiz raporu var', deneyim:'Kendimiz kullandık, sorun olmadı', diger:'Diğer'};
const DAYS = ['paket', 'uretici', 'analiz', 'deneyim', 'diger'];
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
let US = {urunler:[], cikarilanlar:[], zaman:null, kaynak:null, hata:false};
let USKEY = lsGet('gk-sifre') || '', USNAME = lsGet('gk-ad') || '';
function setUs(j, kaynak){
  if (!j || !Array.isArray(j.urunler)) return false;
  const ok = x => x && typeof x === 'object' && x.id != null && x.marka && x.urun && x.ekleyen && x.eklendi;
  US = {urunler: j.urunler.filter(ok), cikarilanlar: (Array.isArray(j.cikarilanlar) ? j.cikarilanlar : []).filter(ok), zaman: j.zaman || null, kaynak, hata: false};
  US.urunler.forEach(it => { it.nn = norm([it.marka, it.urun, it.kategori || ''].join(' ')); it.kn = norm(it.kategori || ''); });
  return true;
}
function saveUs(){
  const strip = x => { const o = Object.assign({}, x); delete o.nn; delete o.kn; return o; };
  lsSet('gk-bizim', JSON.stringify({zaman: US.zaman, urunler: US.urunler.map(strip), cikarilanlar: US.cikarilanlar.map(strip)}));
}
if (API){ try { setUs(JSON.parse(lsGet('gk-bizim') || 'null'), 'onbellek'); } catch (e) {} }
let usBusy = false, usLast = 0;
const usSig = () => US.urunler.map(x => x.id).join(',') + '/' + US.cikarilanlar.map(x => x.id).join(',') + '/' + US.hata;
async function loadUs(draw){
  if (!API || usBusy) return;
  usBusy = true; usLast = Date.now();
  const before = usSig();
  try {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const tm = setTimeout(() => { if (ctl) ctl.abort(); }, 7000);
    const r = await fetch(API + '/liste', {cache: 'no-store', signal: ctl ? ctl.signal : undefined});
    clearTimeout(tm);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const raw = JSON.stringify(j);
    if (!setUs(j, 'canli')) throw new Error('biçim');
    lsSet('gk-bizim', raw);
  } catch (e) {
    if (!US.kaynak){  // telefonda kopya yoksa haftalık yedeği dene
      try { const r = await fetch('bizim.json', {cache: 'no-cache'}); if (r.ok) setUs(await r.json(), 'yedek'); } catch (x) {}
    }
    US.hata = true;
  }
  usBusy = false;
  if (draw && D && usSig() !== before) rerender();
}
addEventListener('online', () => loadUs(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - usLast > 30000) loadUs(true); });
const TZF = (() => { try { return new Intl.DateTimeFormat('tr-TR', {timeZone: 'Europe/Istanbul', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}); } catch (e) { return null; } })();
function fmtWhen(iso){
  const d = new Date(iso); if (isNaN(d)) return '';
  if (TZF && TZF.formatToParts){ const p = {}; TZF.formatToParts(d).forEach(x => { p[x.type] = x.value; }); return p.day + ' ' + p.month + ' ' + p.year + ', ' + p.hour + ':' + p.minute; }
  return d.toLocaleString('tr-TR');
}
function searchUs(q){
  if (!API) return [];
  const qn = norm(q); if (!qn) return [];
  const qt = qn.split(' ');
  return US.urunler.filter(it => { const w = it.nn.split(' '); return qt.every(t => w.some(x => x.startsWith(t))); });
}
function usRow(it, gone){
  const dn = (DOMAINS.find(d => d[0] === it.alan) || ['', ''])[1];
  const meta = [it.kategori || '', it.alan !== st.dom ? dn : ''].filter(Boolean).map(esc).join(' · ');
  const id = +it.id;
  return '<div class="us-it' + (gone ? ' gone' : '') + '" id="us-' + (gone ? 'g' : '') + id + '"><span class="mk m-us" aria-hidden="true">' + ICON.us + '</span><div>' +
    '<div class="us-t"><b>' + esc(it.marka) + '</b> ' + esc(it.urun) + '</div>' +
    (meta ? '<div class="us-m">' + meta + '</div>' : '') +
    '<div class="us-d"><span>Dayanak:</span> ' + esc(DAY[it.dayanak] || it.dayanak) + '</div>' +
    (it.notu ? '<div class="us-n">' + esc(it.notu) + '</div>' : '') +
    '<div class="us-s"><span><b>' + esc(it.ekleyen) + '</b> ekledi · ' + fmtWhen(it.eklendi) +
      (gone && it.cikarildi ? '<br><b>' + esc(it.cikaran) + '</b> listeden çıkardı · ' + fmtWhen(it.cikarildi) : '') + '</span>' +
      (!gone && USKEY ? '<button class="lnk" data-cikar="' + id + '">Listeden çıkar</button>' : '') + '</div></div></div>';
}
function addBtn(q, label){
  return '<button class="addb" data-ekle="' + esc(q || '') + '">' + ICON.plus + '<span>' + esc(label || 'Listemize ürün ekle') + '</span></button>';
}
function usCard(items){
  return '<article class="card v-us"><div class="verdict"><span class="dot">' + ICON.us + '</span><div><p class="vt">Bizim listemizde</p><p class="vs"><b class="k">Sizin eklediğiniz</b> · dernek onayı değil</p></div></div>' +
    '<div class="cats">' + items.map(it => usRow(it)).join('') + '</div></article>';
}
function usHistory(dom){
  const g = US.cikarilanlar.filter(it => it.alan === dom);
  if (!g.length) return '';
  return '<details class="ush"><summary>Geçmiş: ' + g.length + ' ürün listeden çıkarıldı</summary>' + g.slice(0, 50).map(it => usRow(it, true)).join('') + '</details>';
}
function usHome(){
  if (!API) return '';
  const mine = US.urunler.filter(it => it.alan === st.dom);
  const otherN = US.urunler.length - mine.length;
  const lim = st.usAll ? 999 : 5;
  let h = '<div class="sec"><span>Bizim listemiz</span><span>' + mine.length + '</span></div><article class="card v-us">';
  if (US.hata && US.kaynak) h += '<div class="us-off">Sunucuya şu an ulaşılamıyor; telefondaki son liste gösteriliyor.</div>';
  if (mine.length){
    h += mine.slice(0, lim).map(it => usRow(it)).join('');
    if (mine.length > lim) h += '<button class="more" data-usall="1">Tümünü göster (' + mine.length + ')</button>';
  } else {
    h += '<div class="us-e">' + (otherN ? 'Bu sekmede henüz ürün yok. ' : '') + 'Derneklerde olmayan ama güvendiğiniz ürünleri buraya ekleyin. Kimin, ne zaman eklediği otomatik yazılır.</div>';
  }
  h += addBtn('');
  h += '<div class="us-f">' + (USKEY ? 'Bu telefonda <b>' + esc(USNAME || '…') + '</b> olarak ekleniyor · <button class="lnk" data-unut="1">şifreyi bu telefondan sil</button>' : 'İlk eklemede ekleme şifrenizi bir kez girersiniz; bu telefonda saklanır.') +
    (otherN ? '<br>Diğer sekmelerde ' + otherN + ' ürün daha var.' : '') + '</div>';
  return h + usHistory(st.dom) + '</article>';
}
function usCatBlock(c){
  if (!API) return '';
  const its = US.urunler.filter(it => it.alan === c.d && it.kn && (it.kn === c.nn || it.kn.startsWith(c.nn + ' ') || c.nn.startsWith(it.kn + ' ')));
  return its.length ? '<div class="sec"><span>Bizim listemiz</span><span>' + its.length + '</span></div>' + usCard(its) : '';
}
// aramadaki metinden marka ve ürünü ayır (bilinen marka adlarıyla)
function prefill(q){
  const raw = String(q || '').trim().replace(/\s+/g, ' ');
  if (!raw) return {marka: '', urun: ''};
  const qn = norm(raw);
  let best = '', bestN = '';
  const tryB = (name, n) => { if (n && n.length > bestN.length && (qn === n || qn.startsWith(n + ' '))){ best = name; bestN = n; } };
  for (const b in BNORM) tryB(BN[b] || b, BNORM[b]);
  US.urunler.forEach(it => tryB(it.marka, norm(it.marka)));
  const parts = raw.split(' ');
  if (best){
    let i = 0;
    while (i < parts.length && norm(parts.slice(0, i + 1).join(' ')).length < bestN.length) i++;
    return {marka: best, urun: parts.slice(i + 1).join(' ')};
  }
  return {marka: parts[0].charAt(0).toLocaleUpperCase('tr') + parts[0].slice(1), urun: parts.slice(1).join(' ')};
}
let dlg = null, toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3400);
}
function rerender(){ if (D) route(); }
function buildDlg(){
  const d = document.createElement('dialog');
  d.className = 'sheet'; d.setAttribute('aria-labelledby', 'addH');
  d.innerHTML = '<form novalidate>' +
    '<h3 id="addH">Listemize ekle</h3>' +
    '<p class="lead">Dernek onayı yerine geçmez. Ürün mavi “Bizim listemiz” etiketiyle, kimin ve ne zaman eklediği yazılı olarak görünür.</p>' +
    '<fieldset class="seg"><legend>Liste</legend><div class="opts">' + DOMAINS.map(([id, n]) => '<label><input type="radio" name="alan" value="' + id + '"><span>' + n + '</span></label>').join('') + '</div></fieldset>' +
    '<label class="fl">Marka<input name="marka" maxlength="60" list="dlMarka" autocomplete="off" autocapitalize="words" enterkeyhint="next"></label>' +

    '<label class="fl"><span>Kategori <span class="opt">· isteğe bağlı</span></span><input name="kategori" maxlength="60" list="dlKat" autocomplete="off" enterkeyhint="next"></label>' +
    '<fieldset class="rad"><legend>Neye dayanarak ekliyorsunuz?</legend><div class="opts">' + DAYS.map(k => '<label><input type="radio" name="dayanak" value="' + k + '">' + (k === 'diger' ? 'Diğer (not alanına yazın)' : DAY[k]) + '</label>').join('') + '</div></fieldset>' +

// ---- arama
function tokMatch(qt, words){ return words.some(w => w.startsWith(qt)); }
function search(q){
  const qn = norm(q); if (!qn) return null;
  const qt = qn.split(' ');
  const qc = qn.replace(/ /g, '');
  const res = new Map(); // brand -> lines
  const loose = [];      // markasız eşleşen notlar
  for (const l of LN){
    if (l.d !== st.dom) continue;
    const bwords = l.b ? (BNORM[l.b] || '').split(' ').concat([l.b]) : [];
    const words = l.nn.split(' ').concat(bwords, (CAT[l.c] || {}).nn ? CAT[l.c].nn.split(' ') : [], l.hn ? l.hn.split(' ') : []);
    const ok = qt.every(t => tokMatch(t, words)) || (qc.length >= 4 && l.b && (l.b.startsWith(qc) || (BNORM[l.b] || '').replace(/ /g, '').startsWith(qc)));
    if (!ok) continue;
    if (!l.b || l.k === 'note') { loose.push(l); continue; }
    if (!res.has(l.b)) res.set(l.b, []);
    res.get(l.b).push(l);
  }
  // marka adı eşleşme gücüne göre sırala
  const score = b => {
    const n = BNORM[b] || b, nc = n.replace(/ /g, '');
    if (n === qn || nc === qc || b === qc) return 0;
    if (n.startsWith(qn) || nc.startsWith(qc)) return 1;
    if (n.split(' ').some(w => qt.some(t => w.startsWith(t)))) return 2;
    return 3;
  };
  const brands = [...res.keys()].sort((a, b) => score(a) - score(b) || res.get(b).length - res.get(a).length || (BN[a] || a).localeCompare(BN[b] || b, 'tr'));
  const cats = D.cats.filter(c => c.d === st.dom && qt.every(t => c.nn.split(' ').some(w => w.startsWith(t))) && (CATL[c.id] || []).length);
  return {qn, qt, brands, res, loose, cats, score};
}
function suggestions(qn){
  const qc = qn.replace(/ /g, ''); if (qc.length < 3) return [];
  const seen = new Set(), outS = [];
  for (const b in BNORM){
    if (!(LBY[b] || []).some(l => l.d === st.dom)) continue;
    const n = BNORM[b].replace(/ /g, '');
    const lim = qc.length >= 7 ? 2 : 1;
    const d = Math.min(lev(qc, n), lev(qc, n.slice(0, qc.length)) + (n.length > qc.length ? 0 : 9));
    if (d <= lim && !seen.has(BN[b])) { seen.add(BN[b]); outS.push([d, BN[b]]); }
  }
  return outS.sort((a, b) => a[0] - b[0]).slice(0, 6).map(x => x[1]);
}
function verdictFor(sts){
  if (sts.includes('both') || sts.includes('mixed')) return 'ok';
  if (sts.includes('part')) return 'part';
  if (sts.includes('ist') || sts.includes('ank')) return 'one';
  if (sts.includes('read')) return 'rd';
  return 'no';
}
function brandCard(b, lines, toks, full){
  const byC = new Map();
  lines.forEach(l => { if (!byC.has(l.c)) byC.set(l.c, []); byC.get(l.c).push(l); });
  const order = {both:0, mixed:1, part:2, ist:3, ank:3, read:4, warn:5};
  const isCond = l => l.k === 'ok' && (l.w || CONDT.test(l.t));
  const condC = new Set(lines.filter(isCond).map(l => l.c));
  const cs = [...byC.keys()].map(c => [c, groupStatus(b, c)]).sort((x, y) => order[x[1]] - order[y[1]] || condC.has(y[0]) - condC.has(x[0]) || CAT[x[0]].n.localeCompare(CAT[y[0]].n, 'tr'));
  const sts = cs.map(x => x[1]);
  const v = verdictFor(sts);
  const nb = sts.filter(s => s === 'both').length, n1 = sts.filter(s => s === 'ist' || s === 'ank' || s === 'part').length;
  const hasWarn = lines.some(l => l.k === 'warn');
  const hasOk = lines.some(l => l.k === 'ok');
  const sartli = condC.size > 0;
  let title, sub;
  if (hasWarn && !hasOk){
    const ic2 = ICON.warn;
    return brandCardShell(b, 'no', ic2, 'Gluten uyarısı var', 'Listelerde bu marka için uyarı satırı bulunuyor; satırları okuyun.', cs, byC, toks, full);
  }
  const okL = lines.filter(l => l.k === 'ok');
  const pBoth = Math.max(okL.filter(l => l.st === 'both' && l.s === 'ist').length, okL.filter(l => l.st === 'both' && l.s === 'ank').length);
  const pOne = okL.filter(l => l.st === 'part' || l.st === 'one').length;
  if (v === 'ok' && pOne){ title = pBoth >= pOne ? 'Çoğu ürünü iki listede' : 'Bazı ürünleri iki listede'; sub = '<strong>' + pBoth + ' ürün iki listede</strong>, ' + pOne + ' ürün tek listede' + (sartli ? '<br>Şart var (' + [...condC].map(c => esc(CAT[c].n)).slice(0, 3).join(', ') + '): altı çizili ifadeleri okuyun.' : ''); }
  else if (v === 'ok'){ title = 'İki listede de var'; sub = nb + ' kategoride <strong>iki listede</strong>' + (n1 ? ', ' + n1 + ' kategoride tek listede' : '') + (sartli ? '<br>Şart var (' + [...condC].map(c => esc(CAT[c].n)).slice(0, 3).join(', ') + '): altı çizili ifadeleri okuyun.' : ''); }
  else if (v === 'part'){ title = 'Marka iki listede, bu ürünler tek listede'; sub = 'Ürünü kontrol edin: aşağıda iki listenin metni yan yana.'; }
  else if (v === 'one'){ const only = sts.includes('ist') && !sts.includes('ank') ? 'İstanbul' : (sts.includes('ank') && !sts.includes('ist') ? 'Ankara' : 'tek'); title = 'Yalnızca ' + (only === 'tek' ? 'tek listede' : only + ' listesinde'); sub = '<span class="k">Paketi inceleyerek</span> alın.'; }
  else if (v === 'rd'){ title = 'Onay listesinde değil — etiketi okunacak firmalar arasında'; sub = 'Dernekler bu firmanın ürünlerini ambalaj okunarak almayı öneriyor.'; }
  else { title = 'Uyarı'; sub = 'Aşağıdaki ürün(ler) için gluten uyarısı var.'; }
  if (v === 'one' && st.dom === 'ilac') sub = 'Diğer listede adı geçmiyor. Kutudaki <strong>üretici firmayı</strong> aşağıdaki listeyle karşılaştırın.';
  const ic = {ok:ICON.ok2, part:ICON.half, one:ICON.ok, rd:ICON.eye, no:ICON.warn}[v];
  return brandCardShell(b, v, ic, title, sub + (hasWarn && v !== 'no' ? ' · <span style="color:var(--no);font-weight:700">uyarı içeren satır var</span>' : ''), cs, byC, toks, full, sartli && v === 'ok');
}
function repLink(b, v){
  const r = REP[b];
  if (!r || !['ok', 'part', 'one'].includes(v)) return '';
  return '<a class="rep" href="' + esc(r.url) + '" target="_blank" rel="noopener" title="Satıcının yayınladığı laboratuvar raporları. Bilgi amaçlıdır, dernek onayı yerine geçmez; raporların çoğu parti bazlı değildir.">' +

function brandCardShell(b, v, ic, title, sub, cs, byC, toks, full, sartli){
  const limit = full ? 99 : 4;
  let rows = '';
  cs.slice(0, limit).forEach(([c, s]) => {
    const ls = byC.get(c).slice().sort(lineOrder);
    const shown = new Set(ls.map(l => l.i)), extra = [];
    ls.forEach(l => l.st === 'both' && (l.p || []).forEach(pid => { const pl = LN[pid]; if (pl && pl.c !== c && pl.b === b && !shown.has(pid)) { shown.add(pid); extra.push(pl); } }));
    const notes = (CATL[c] || []).filter(n => n.k === 'note' && (n.af || /serbest|ko[sş]ulu|olmamas/i.test(n.t))).slice(0, 3);
    rows += '<div class="crow"><div class="chead"><span class="cname">' + esc(CAT[c].n) + '</span>' + chip(s) + '</div><ul class="ls">' +
      ls.map(l => lineRow(l, toks)).join('') + extra.map(l => lineRow(l, toks)).join('') + '</ul>' +
      (extra.length ? '<p class="xc">Diğer listede bu ürün başka bir başlık altında yer alıyor.</p>' : '') +
      notes.map(n => '<div class="note' + (n.af ? ' af' : '') + '"><span class="src">' + SRC[n.s] + '</span>' + esc(n.t) + '</div>').join('') + '</div>';
  });
  const moreBtn = cs.length > limit ? '<button class="more" data-brand="' + esc(b) + '">Tüm kategoriler (' + cs.length + ')</button>' : '';
  return '<article class="card v-' + v + '"><div class="verdict"><span class="dot">' + ic + '</span><div><p class="vt">' + esc(BN[b] || b) + '</p><p class="vs"><b class="k">' + title + '</b>' + (sartli ? '<span class="sart">Şartlı</span>' : '') + (sub ? ' · ' + sub : '') + '</p></div></div>' + repLink(b, v) + '<div class="cats">' + rows + '</div>' + moreBtn + '</article>';
}
function catCounts(c){
  const bs = new Map();
  (CATL[c] || []).forEach(l => { if (l.b && (l.k === 'ok')) { const s = groupStatus(l.b, c); bs.set(l.b, s === 'mixed' ? 'both' : s); } });
  const n = {both:0, part:0, ist:0, ank:0};
  bs.forEach(s => { if (n[s] !== undefined) n[s]++; });
  return n;
}
function meter(n){
  const t = n.both + n.part + n.ist + n.ank || 1;
  return '<span class="meter" aria-hidden="true"><i class="a" style="width:' + (n.both / t * 100) + '%"></i><i class="b" style="width:' + (n.part / t * 100) + '%"></i><i class="c" style="width:' + ((n.ist + n.ank) / t * 100) + '%"></i></span>';
}
function catTile(c){
  const n = catCounts(c.id);
  const tot = n.both + n.part + n.ist + n.ank;
  const af = (CATL[c.id] || []).find(l => l.k === 'note' && l.af);

  return '<button class="cat" data-cat="' + c.id + '"><span class="n">' + esc(c.n) + '</span>' + meter(n) + '<span class="s">' + n.both + ' iki listede · ' + (n.part + n.ist + n.ank) + ' tek listede</span></button>';

function afNotes(dom){

function weekChanges(){
  const e = (D.changes || [])[0];
  if (!e || !(e.added.length + e.removed.length)) return '';
  const age = (Date.now() - new Date(e.date + 'T12:00:00+03:00').getTime()) / 864e5;
  if (!(age <= 8)) return '';
  const row = (x, add) => '<li>' + (add ? '+' : '−') + ' <span class="src">' + SRC[x.s] + '</span> ' + (add ? esc(x.t) : '<s>' + esc(x.t) + '</s>') +
    ((CAT[x.c] || {}).n ? ' <span class="cn">· ' + esc(CAT[x.c].n) + '</span>' : '') + '</li>';
  const items = e.added.slice(0, 8).map(x => row(x, true)).join('') + e.removed.slice(0, 8).map(x => row(x, false)).join('');
  const more = e.added.length > 8 || e.removed.length > 8 ? '<p class="more">Tamamı aşağıda, “Son değişiklikler” bölümünde.</p>' : '';
  return '<div class="sec"><span>Bu hafta değişenler</span><span>' + fmtDate(e.date) + '</span></div>' +
    '<div class="card wk"><p class="wk-h"><b>' + e.added.length + '</b> satır eklendi · <b>' + e.removed.length + '</b> satır çıkarıldı</p><ul class="chg">' + items + '</ul>' + more + '</div>';
}
function home(){
  const cats = D.cats.filter(c => c.d === st.dom && (CATL[c.id] || []).some(l => l.k === 'ok' || (l.k === 'note' && l.af)));
  cats.sort((a, b) => a.n.localeCompare(b.n, 'tr'));
  let h = legend() + weekChanges() + usHome();
  const af = afNotes(st.dom);
  if (st.dom === 'ilac') h += ilacFirms();
  h += '<div class="sec"><span>Kategoriler</span><span>' + cats.length + '</span></div><div class="grid">' + cats.map(catTile).join('') + '</div>';
  if (af.length) h += '<details class="fold"><summary>Ankara’nın “tüm markalar serbest” dediği kategoriler</summary><div class="fbody">' + af.map(n => '<p><b>' + esc(CAT[n.c].n) + ':</b> ' + esc(n.t) + '</p>').join('') + '<p class="small">Bu kategorilerde listede adı geçmeyen markalar da Ankara listesine göre serbest sayılıyor.</p></div></details>';
  h += infoBlocks();
  out.innerHTML = h;
}
function ilacFirms(){
  const fs = LN.filter(l => l.c === 'ilac-firma' && l.k === 'ok');
  const by = new Map();
  fs.forEach(l => { const k = l.b; if (!by.has(k)) by.set(k, []); by.get(k).push(l); });
  const rows = [...by.entries()].sort((a, b) => (BN[a[0]] || a[0]).localeCompare(BN[b[0]] || b[0], 'tr')).map(([b, ls]) => {
    const s = groupStatus(b, 'ilac-firma');
    return '<div class="crow"><div class="chead"><span class="cname">' + esc(BN[b] || b) + '</span>' + chip(s) + '</div><ul class="ls">' + ls.map(l => lineRow(l, [])).join('') + '</ul></div>';
  }).join('');
  return '<div class="sec"><span>Tüm ilaçları glutensiz sayılan firmalar</span></div><article class="card v-ok"><div class="verdict"><span class="dot">' + ICON.ok2 + '</span><div><p class="vt">Kutudaki üretici firmaya bakın</p><p class="vs">İlaç adı listede yoksa bile üreticisi bu firmalardansa dernek(ler) glutensiz sayıyor.</p></div></div><div class="cats">' + rows + '</div></article>';
}
function infoBlocks(){
  const s = D.sources;
  const src = ['ist', 'ank'].map(k => s[k].pages.map(p => '<a href="' + esc(p.url) + '" target="_blank" rel="noopener"><span><b>' + esc(s[k].city) + '</b> · ' + esc(p.title) + '</span><span>' + fmtDate(p.modified) + '</span></a>').join('')).join('');
  const ch = D.changes || [];
  const chHtml = ch.length ? ch.map(e => '<p><b>' + fmtDate(e.date) + '</b></p><ul class="chg">' +
      e.added.slice(0, 40).map(x => '<li>+ <span class="src">' + SRC[x.s] + '</span> ' + esc(x.t) + '</li>').join('') +
      e.removed.slice(0, 40).map(x => '<li>− <span class="src">' + SRC[x.s] + '</span> <s>' + esc(x.t) + '</s></li>').join('') + '</ul>').join('')
    : '<p>İlk sürüm. Listeler bundan sonra her hafta otomatik kontrol edilecek; eklenen ve çıkarılan ürünler burada görünecek.</p>';
  const ex = D.extras || {};
  const inst = STANDALONE ? '' : '<details class="fold"><summary>Telefona uygulama gibi ekleyin</summary><div class="fbody">' +
      '<p><b>iPhone:</b> Safari’de açın → Paylaş düğmesi → <b>Ana Ekrana Ekle</b>.</p>' +
      '<p><b>Android:</b> Chrome’da açın → sağ üstteki menü → <b>Ana ekrana ekle</b> (ya da <b>Uygulamayı yükle</b>).</p>' +
      '<p class="small">Bir kez açtıktan sonra liste telefona kaydedilir; markette internet çekmese de arama çalışır. İnternet varken her açılışta güncel liste alınır.</p></div></details>';
  return '<div class="sec"><span>Kaynaklar ve diğer bölümler</span></div>' + inst +
    '<details class="fold"><summary>Son değişiklikler</summary><div class="fbody">' + chHtml + '</div></details>' +
    '<details class="fold"><summary>Kaynak listeler ve son güncelleme tarihleri</summary><div class="fbody"><div class="src-l">' + src + '</div><p class="small">Tarihler derneklerin sitesindeki sayfanın son düzenlenme tarihidir.</p></div></details>' +
    '<details class="fold"><summary>Ek kaynaklar (bilgi amaçlı, onay yerine geçmez)</summary><div class="fbody">' +
      '<p><a href="https://www.dogaevinizde.com/gluten-analiz-raporlari" target="_blank" rel="noopener"><b>Gluten analiz raporları</b></a> · Doğa Evinizde. 18 markanın laboratuvar raporları (PDF). Listelerde de geçen markaların kartında “Analiz raporu var” bağlantısı görünür. Raporların çoğu parti bazlı değil; elinizdeki paketin raporu olmayabilir.</p>' +
      '<p><a href="https://guvenilirgida.tarimorman.gov.tr/gkd" target="_blank" rel="noopener"><b>Taklit veya tağşiş yapılan gıdalar</b></a> · Tarım ve Orman Bakanlığı. Site otomatik taramaya kapalı olduğu için burada izlenmiyor; marka adıyla elle aranabilir ya da Bakanlığın Güvenilir Gıda uygulamasından bakılabilir.</p>' +
      '</div></details>' +
    '<details class="fold" id="ext"><summary>Ankara listesi: glutensiz mekânlar, oteller, üniversiteler</summary><div class="fbody">' +
      '<p class="small">Bu bölümler yalnızca Ankara listesinde var; karşılaştırma yapılmadı.</p>' +
      '<p><b>Mekânlar (' + (ex.mekan || []).length + ')</b></p>' + (ex.mekan || []).map(v => '<div class="venue"><b>' + esc(v.name) + '</b><span>' + esc(v.details.join(' · ')) + '</span></div>').join('') +
      '<p style="margin-top:14px"><b>Oteller (' + (ex.otel || []).length + ')</b></p>' + (ex.otel_note ? '<p class="small">' + esc(ex.otel_note) + '</p>' : '') + (ex.otel || []).map(v => '<div class="venue"><b>' + esc(v.name) + '</b><span>' + esc(v.details.join(' · ')) + '</span></div>').join('') +
      '<p style="margin-top:14px"><b>Glutensiz menüsü olan üniversiteler</b></p><p>' + esc((ex.universite || []).join(', ')) + '</p></div></details>' +
    '<details class="fold"><summary>Nasıl çalışır?</summary><div class="fbody">' +
      '<p>Sayfa iki derneğin listesini satır satır okur, her satırın markasını ve kategorisini bulur, sonra diğer listede aynı markanın aynı ürününü arar.</p>' +
      '<p><span class="kbd">Yeşil çift tik</span>: aynı ürün (ya da markanın o kategorideki tüm ürünleri) diğer listede de var. <span class="kbd">Sarı çizgi</span>: marka diğer listede var ama bu ürün yok. <span class="kbd">Sarı tik</span>: yalnızca bu listede. <span class="kbd">Göz</span>: onay değil, “etiketi okunarak alınacak” firmalar. <span class="kbd">Kırmızı üçgen</span>: listede gluten uyarısı.</p>' +
      '<p>Eşleştirme temkinlidir: emin olamadığında “tek listede” der. Her satır listedeki orijinal metindir; altı çizili ifadeler koşul (hariç, sadece, etiketi okuyun), kırmızı ifadeler gluten uyarısıdır.</p>' +
      (API ? '<p><span class="kbd">Mavi yer imi</span>: “Bizim listemiz”, yani sizin eklediğiniz ürünler. Dernek onayı değildir ve yeşil/sarı/kırmızı kararı değiştirmez. Kimin eklediğini telefondaki ekleme şifresi, tarihi sunucunun saati belirler; kayıt sonradan değiştirilemez. Listeden çıkarılan ürünler “Geçmiş” bölümünde kimin, ne zaman çıkardığıyla birlikte kalır.</p>' : '') +
      '</div></details>' +
    '<p class="foot">Dernekler, üreticilerin üretim koşullarını haber vermeden değiştirebildiğini ve listede olsa bile ambalajdaki alerjen bilgisinin okunması gerektiğini belirtiyor. Bu sayfa listeleri birleştirir; onay vermez.</p>';
}
function results(q){
  let r = search(q);
  if (!r) return home();
  let h = '';
  // bu sekmede hiç sonuç yoksa diğer sekmelere bak (ör. Gıda'da "Parol" → İlaç)
  if (!r.brands.length && !r.cats.length){
    const from = st.dom;
    let moved = null;
    for (const [d, n] of DOMAINS){
      if (d === from) continue;
      st.dom = d;
      const r2 = search(q);
      if (r2 && (r2.brands.length || r2.cats.length)){ r = r2; moved = n; break; }
    }
    if (moved){
      drawTabs();
      h += '<p class="small moved">“' + esc(q.trim()) + '” ' + DOMAINS.find(d => d[0] === from)[1] + ' sekmesinde yok; <b>' + moved + '</b> listesinde gösteriliyor.</p>';
    } else st.dom = from;
  }
  // bizim listemizdeki eşleşmeler (tüm sekmelerde)
  const us = searchUs(q);
  const usBlock = us.length ? '<div class="sec"><span>Bizim listemiz</span><span>' + us.length + '</span></div>' + usCard(us.slice(0, 30)) : '';
  const addLine = API ? '<p class="addline"><button class="lnk us" data-ekle="' + esc(q.trim()) + '">＋ Aradığınız ürün yoksa listemize ekleyin</button></p>' : '';
  // kategori adıyla eşleşme
  const catOnly = r.cats.length && !r.brands.some(b => r.score(b) <= 1);
  if (catOnly){
    const best = r.cats.slice().sort((a, b) => (a.nn.split(' ')[0] === r.qt[0] ? 0 : 1) - (b.nn.split(' ')[0] === r.qt[0] ? 0 : 1) || a.nn.length - b.nn.length)[0];
    const others = r.cats.filter(c => c !== best);
    st.cat = best.id;
    out.innerHTML = h + usBlock + catView(best.id, true) + (others.length ? '<div class="sec"><span>İlgili kategoriler</span></div><div class="grid">' + others.slice(0, 6).map(catTile).join('') + '</div>' : '') + addLine;
    return;
  }
  const exact = r.brands.filter(b => r.score(b) === 0);
  const strong = r.brands.filter(b => r.score(b) <= 2);
  const weak = r.brands.filter(b => r.score(b) === 3);
  const catHtml = r.cats.length ? '<div class="sec"><span>Kategori</span></div><div class="grid">' + r.cats.slice(0, 6).map(catTile).join('') + '</div>' : '';
  if (!exact.length) h += catHtml;
  if (r.brands.length){
    const cards = strong.length ? strong : weak;
    const rest = strong.length ? weak : [];
    h += '<div class="sec"><span><b>' + cards.length + '</b> marka</span><span>' + DOMAINS.find(d => d[0] === st.dom)[1] + '</span></div>';
    cards.slice(0, 30).forEach(b => { h += brandCard(b, r.res.get(b), r.qt, st.open.has(b)); });
    if (cards.length > 30) h += '<p class="small">İlk 30 marka gösteriliyor; aramayı daraltın.</p>';
    if (rest.length){
      h += '<div class="sec"><span>Ürün adında geçenler</span><span>' + rest.length + '</span></div><div class="card">' +
        rest.slice(0, 40).map(b => {
          const ls = r.res.get(b), cs = [...new Set(ls.map(l => l.c))];
          const so = {both:0, mixed:1, part:2, ist:3, ank:3, read:4, warn:5};
          const s0 = cs.map(c => groupStatus(b, c)).sort((x, y) => so[x] - so[y])[0];
          return '<button class="brow" data-q="' + esc(BN[b] || b) + '"><span class="lft"><span class="bn">' + esc(BN[b] || b) + '</span><span class="pv">' + esc(ls.map(l => l.t).join(' · ')) + '</span></span>' + chip(s0) + '</button>';
        }).join('') + '</div>';
    }
  }
  const none = !r.brands.length && !r.cats.length;
  if (!none) h += usBlock;
  if (exact.length) h += catHtml;
  if (st.dom === 'ilac' && r.brands.length) h += ilacFirms();
  if (r.loose.length){
    h += '<div class="sec"><span>Notlarda geçiyor</span></div><div class="card"><div class="cats">' + r.loose.slice(0, 8).map(l => '<div class="crow"><div class="chead"><span class="cname">' + esc(CAT[l.c].n) + '</span></div><ul class="ls">' + lineRow(l, r.qt) + '</ul></div>').join('') + '</div></div>';
  }
  if (none){
    const sg = suggestions(r.qn);
    const other = DOMAINS.filter(d => d[0] !== st.dom).map(d => [d, LN.filter(l => l.d === d[0] && r.qt.every(t => l.nn.split(' ').some(w => w.startsWith(t)))).length]).filter(x => x[1]);
    h += usBlock;
    h += '<article class="card v-no"><div class="verdict"><span class="dot">' + ICON.no + '</span><div>' +
      (us.length ? '<p class="vt">“' + esc(q.trim()) + '” dernek listelerinde yok</p><p class="vs"><b class="k">Derneklerde bulunamadı</b> · Yalnızca bizim listemizde var (yukarıda).</p>'
        : '<p class="vt">“' + esc(q.trim()) + '” hiçbir listede yok</p><p class="vs"><b class="k">Hiçbir listede bulunamadı</b> · Kuralınıza göre almıyorsunuz.</p>') + '</div></div>' +
      (sg.length ? '<div class="empty" style="padding-top:0">Yazım farkı olabilir — bunu mu demek istediniz?</div><div class="sugg">' + sg.map(s => '<button class="sg" data-q="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' : '') +
      (other.length ? '<div class="sugg">' + other.map(([d, n]) => '<button class="sg" data-dom="' + d[0] + '">' + d[1] + ' listesinde ' + n + ' sonuç</button>').join('') + '</div>' : '') +
      (API && !us.length ? addBtn(q.trim(), '“' + q.trim() + '” ürününü listemize ekle') : '') +
      '</article>';
    if (st.dom === 'gida'){
      const af = afNotes('gida');
      if (af.length) h += '<details class="fold"><summary>Ama şu kategorilerde Ankara tüm markaları serbest sayıyor</summary><div class="fbody">' + af.map(n => '<p><b>' + esc(CAT[n.c].n) + ':</b> ' + esc(n.t) + '</p>').join('') + '</div></details>';
    }
  }
  if (!(none && !us.length)) h += addLine;  // boş sonuçta ekleme düğmesi zaten kırmızı kartın içinde
  out.innerHTML = h;
}
function catView(id, fromSearch){
  const c = CAT[id]; if (!c) return '';
  const ls = CATL[id] || [];
  const bs = new Map();
  ls.forEach(l => { if (l.b && l.k !== 'note') { if (!bs.has(l.b)) bs.set(l.b, []); bs.get(l.b).push(l); } });
  const sec = {both:[], part:[], ist:[], ank:[], read:[], warn:[]};
  bs.forEach((lst, b) => { const s = groupStatus(b, id); (sec[s === 'mixed' ? 'both' : s] || sec.ist).push(b); });
  for (const k in sec) sec[k].sort((a, b) => (BN[a] || a).localeCompare(BN[b] || b, 'tr'));
  const notes = ls.filter(l => l.k === 'note');
  const n = catCounts(id);
  let h = (fromSearch ? '' : '<button class="back" data-back="1">' + ICON.back + 'Tüm kategoriler</button>') +
    '<h2>' + esc(c.n) + '</h2><p class="small">' + n.both + ' marka iki listede · ' + n.part + ' marka iki listede ama ürünler farklı · ' + n.ist + ' sadece İstanbul · ' + n.ank + ' sadece Ankara</p>';
  if (notes.length) h += notes.map(nn => '<div class="note' + (nn.af ? ' af' : '') + '"><span class="src">' + SRC[nn.s] + '</span>' + esc(nn.t) + '</div>').join('');
  if (!fromSearch) h += usCatBlock(c);  // aramadan gelindiyse eşleşmeler zaten yukarıda
  const block = (key, title) => {
    if (!sec[key].length) return '';
    return '<div class="sec"><span>' + title + '</span><span>' + sec[key].length + '</span></div><div class="card">' +
      sec[key].map(b => {
        const lst = bs.get(b).slice().sort(lineOrder);
        const open = st.open.has(id + '|' + b);
        return '<button class="brow" data-ob="' + esc(id + '|' + b) + '" aria-expanded="' + open + '"><span class="lft"><span class="bn">' + esc(BN[b] || b) + '</span><span class="pv">' + esc(lst.map(l => l.t).join(' · ')) + '</span></span>' + chip(key === 'both' ? groupStatus(b, id) : key) + '</button>' +
          (open ? '<div class="bdet"><ul class="ls">' + lst.map(l => lineRow(l, [])).join('') + '</ul></div>' : '');
      }).join('') + '</div>';
  };
  h += block('both', 'İki listede de') + block('part', 'Marka iki listede, ürünler farklı') + block('ist', 'Sadece İstanbul') + block('ank', 'Sadece Ankara') + block('read', 'Etiketi okunarak alınacak') + block('warn', 'Uyarılar');
  return h;
}

// ---- yönlendirme
function route(){
  const hsh = (location.hash || '').slice(1);
  if (hsh.startsWith('k-') && CAT[hsh.slice(2)]){
    st.view = 'cat'; st.cat = hsh.slice(2);
    const d = CAT[st.cat].d; if (d !== st.dom){ st.dom = d; drawTabs(); }
    out.innerHTML = catView(st.cat, false);
    return;
  }
  st.view = st.q ? 'search' : 'home';
  if (st.q) results(st.q); else home();
}
let tmr;
qi.addEventListener('input', () => {
  st.q = qi.value; clearB.classList.toggle('on', !!st.q); st.open.clear();
  document.body.classList.toggle('searching', !!st.q.trim());
  clearTimeout(tmr); tmr = setTimeout(() => { if (location.hash) history.replaceState(null, '', location.pathname + location.search); route(); }, 90);
});
qi.addEventListener('keydown', e => { if (e.key === 'Enter') qi.blur(); });
clearB.addEventListener('click', () => { qi.value = ''; st.q = ''; clearB.classList.remove('on'); document.body.classList.remove('searching'); route(); qi.focus(); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-dom]'); if (!b) return;
  st.dom = b.dataset.dom; try { localStorage.setItem('gk-dom', st.dom); } catch (x) {}
  drawTabs(); if (location.hash) history.replaceState(null, '', location.pathname + location.search); route();
});
out.addEventListener('click', e => {
  const t = e.target.closest('button,[data-cat]'); if (!t) return;
  if (usClick(t)) return;
  if (t.dataset.cat){ location.hash = 'k-' + t.dataset.cat; window.scrollTo(0, 0); return; }
  if (t.dataset.back){ history.length > 1 ? history.back() : (location.hash = ''); return; }
  if (t.dataset.q){ qi.value = t.dataset.q; qi.dispatchEvent(new Event('input')); return; }
  if (t.dataset.dom){ st.dom = t.dataset.dom; drawTabs(); route(); return; }
  if (t.dataset.brand){ st.open.add(t.dataset.brand); route(); return; }
  if (t.dataset.ob){ const k = t.dataset.ob; st.open.has(k) ? st.open.delete(k) : st.open.add(k); out.innerHTML = catView(st.cat || k.split('|')[0], st.view !== 'cat'); return; }
});
window.addEventListener('hashchange', route);
const bar = $('#bar');
const io = new IntersectionObserver(([en]) => bar.classList.toggle('stuck', !en.isIntersecting), {rootMargin:'-1px 0px 0px 0px'});
io.observe(document.querySelector('header.top'));
load();
}
</script>
