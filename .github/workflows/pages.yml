name: Sayfayı yayınla

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:     # haftalık kontrol değişiklik kaydedince bunu başlatır

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  paketle:
    needs: test          # testler geçmeden yayın yok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # haftalık kontrolün az önce kaydettiği son sürüm
      - name: Sürüm damgası (stil, betik ve çevrimdışı önbellek bu yayına özgü olsun)
        run: bash scripts/surum.sh site "$(git rev-parse --short HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: paketle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Yüklenen paket bazen birkaç saniye görünmüyor: ilk deneme olmazsa bekleyip yeniden dene
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
