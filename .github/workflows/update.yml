name: Haftalık liste kontrolü

on:
  schedule:
    - cron: '33 7 * * 1'   # her pazartesi 10:33 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: liste-kontrolu
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.apply.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r scripts/requirements.txt

      - name: Dernek listelerini çek
        run: python3 -I scripts/fetch.py out/fetch

      - name: Derle ve önceki listeyle karşılaştır
        run: python3 -I scripts/update.py out/fetch/ank.json out/fetch/ist.json raw/pages.json site/data.json scripts/pipeline.py out/build

      - name: Uygula ve bildir
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: bash scripts/apply.sh

      - name: Çalışma dosyalarını sakla (hata ayıklama için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kontrol-${{ github.run_number }}
          path: out/
          retention-days: 14

  yayinla:
    needs: kontrol
    if: needs.kontrol.outputs.deploy == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
