name: Haftalık liste kontrolü

on:
  schedule:
    - cron: '33 7 * * 1'   # her pazartesi 10:33 (Türkiye saati)
  workflow_dispatch:
    inputs:
      bildirim_testi:
        description: 'Telegram / web kancası ayarını denemek için test mesajı gönder'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write     # yayın iş akışını başlatmak için

concurrency:
  group: liste-kontrolu
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r scripts/requirements.txt

      - name: Dernek listelerini çek
        run: python3 -I scripts/fetch.py out/fetch

      - name: Derle ve önceki listeyle karşılaştır
        run: python3 -I scripts/update.py out/fetch/ank.json out/fetch/ist.json raw/pages.json site/data.json scripts/pipeline.py out/build

      - name: Analiz raporlarını çek (bilgi amaçlı)
        run: python3 -I scripts/reports.py "$( [ -f out/build/data.json ] && echo out/build/data.json || echo site/data.json )" site/reports.json

      - name: Uygula ve bildir
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          BIZIM_API: ''   # Bizim listemiz sunucusunun adresi (yayından sonra yazılır)
        run: bash scripts/apply.sh

      - name: Bildirim testi
        if: inputs.bildirim_testi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          printf 'Bildirim ayarı çalışıyor. Listeler değiştiğinde buraya mesaj gelecek.\nhttps://%s.github.io/%s/\n' "${{ github.repository_owner }}" "${{ github.event.repository.name }}" > out/test.txt
          bash scripts/notify.sh "Glutensiz Kontrol: bildirim testi" out/test.txt

      - name: Sayfayı yeniden yayınla
        if: steps.apply.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Çalışma dosyalarını sakla (hata ayıklama için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kontrol-${{ github.run_number }}
          path: out/
          retention-days: 14
